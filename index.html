<html lang="pt-BR">

    <!-- Preload prioritário da imagem da Themis para eliminar qualquer flash ou delay inicial -->
    <link rel="preload" as="image" href="/img/novofundohero.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/img/holding-family-hero-bg.jpg" />
    <link rel="preload" as="image" href="/img/holding-familiar-1.jpg" />
    <link rel="preload" as="image" href="/img/logo.png" />
    <style>
      /* Renderização instantânea do fundo antes mesmo do React hidratar para eliminar 100% o flash azul */
      #root:empty {
        min-height: 100vh;
        background-color: #050B14;
        background-image: url('/img/novofundohero.jpg');
        background-size: cover;
        background-position: top center;
        background-repeat: no-repeat;
      }
    </style>
  </head>
  <body class="bg-[#050B14] text-slate-100 antialiased selection:bg-[#D4AF37]/30 selection:text-[#F6E27A]">
    <div id="root"></div>

  </body>
